<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Chlädderi share card</title>
    <!--
      Chlädderi – the source of og.png, the picture a shared link shows.

        node tools/make-og.mjs

      1200x630 is what Open Graph asks for and what WhatsApp, Discord, Slack and X lay out against.

      The picture is the app's own icon beside its name, because that is what the card is for: the
      link should look like the thing already on somebody's homescreen. The icon is shown at the
      size it was drawn for rather than blown up across the card -- it is a 64-unit drawing, reduced
      to what survives at 32 px, and it reads as a shape rather than a cliff when it fills a banner.

      Two things the design has to survive. The card sits on white in a light chat and on near-black
      in a dark one, so it carries its own background and nothing here is transparent. And some
      clients crop it to a square thumbnail, so the tile and the start of the name stay inside the
      middle 630 pixels rather than hugging the two edges.

      The type is the app's own Barlow, loaded out of node_modules so the card is set in the same
      face as the screen it advertises; tools/make-og.mjs fails if it did not load.
    -->
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 700;
        font-style: normal;
        src: url("../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        font-style: normal;
        src: url("../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2")
          format("woff2");
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 72px;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 0 96px;
        overflow: hidden;
        /*
         * Night behind the icon, so the sunset in it carries the colour on its own. Straight down
         * rather than on the diagonal: every row of a vertical gradient is identical, which a PNG
         * stores for almost nothing, and the same picture on the diagonal costs a third of the
         * budget below.
         */
        background: linear-gradient(180deg, #2b1780 0%, #1d0f5c 52%, #140838 100%);
      }

      /* The sea of the icon, drawn once across the foot of the card. */
      .card::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 10px;
        content: "";
        background: linear-gradient(90deg, #34e2d0, #0c86b4 60%, #f0246b);
      }

      .tile {
        flex: none;
        filter: drop-shadow(0 24px 48px rgba(8, 2, 28, 0.55));
      }

      .words {
        min-width: 0;
      }

      .name {
        font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
        font-weight: 700;
        font-size: 150px;
        line-height: 0.96;
        letter-spacing: -0.015em;
        color: #fff5e6;
      }

      .line {
        margin-top: 30px;
        font-family: "Barlow", Arial, sans-serif;
        font-weight: 500;
        font-size: 41px;
        line-height: 1.34;
        color: #f3dfbd;
      }

      .host {
        margin-top: 34px;
        font-family: "Barlow", Arial, sans-serif;
        font-weight: 500;
        font-size: 31px;
        letter-spacing: 0.02em;
        color: #b79ae6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- favicon.svg, at the size it was drawn for. Kept in step with it by hand: it is nine
           shapes, and a build step that read the file would still have to re-render this card. -->
      <svg
        class="tile"
        width="296"
        height="296"
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <clipPath id="tile">
            <rect width="64" height="64" rx="14" />
          </clipPath>
          <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="45">
            <stop offset="0" stop-color="#2B1780" />
            <stop offset=".45" stop-color="#8A22A8" />
            <stop offset=".75" stop-color="#F2416E" />
            <stop offset="1" stop-color="#FF9B3F" />
          </linearGradient>
          <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="45" x2="0" y2="64">
            <stop offset="0" stop-color="#34E2D0" />
            <stop offset="1" stop-color="#0C86B4" />
          </linearGradient>
          <linearGradient id="pin-fill" gradientUnits="userSpaceOnUse" x1="29" y1="6" x2="38" y2="31">
            <stop offset="0" stop-color="#FFA13D" />
            <stop offset="1" stop-color="#F0246B" />
          </linearGradient>
        </defs>
        <g clip-path="url(#tile)">
          <rect width="64" height="64" fill="url(#sky)" />
          <circle cx="13" cy="41" r="7.5" fill="#FFF1C4" />
          <rect y="45" width="64" height="19" fill="url(#sea)" />
          <path d="M40 30.3 L47 36 L48 46 L52 53 L53 64 H39 L36 48 L39 37 Z" fill="#F6A2A3" />
          <path d="M48 46 L52 53 L53 64 H46 L45 55 Z" fill="#9A50A6" />
          <path d="M34 26 L27 35 L25 46 L20 52 L18 64 H40 L37 48 L40 37 L41 31 Z" fill="#FFF5E6" />
          <path
            d="M25.5 58 L31.5 49 L30.5 41 L34 30"
            fill="none"
            stroke="#2A1670"
            stroke-width="4.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M25.8 19.7 A9.5 9.5 0 1 1 42.2 19.7 C40.3 23 36.6 26.4 36.3 30.2 A2.3 2.3 0 0 1 31.7 30.2 C31.4 26.4 27.7 23 25.8 19.7 Z"
            fill="url(#pin-fill)"
          />
          <circle cx="34" cy="15" r="3.7" fill="#FFF9EE" />
        </g>
      </svg>
      <div class="words">
        <div class="name">Chlädderi</div>
        <div class="line">Sportklettergebiete:<br />Karte, Zustieg, Wetter – offline</div>
        <div class="host">chlädderi.ch</div>
      </div>
    </div>
  </body>
</html>
