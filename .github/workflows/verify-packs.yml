name: Verify the published regions

# The encrypted regions are published onto gh-pages from the private Chlaedderi/maps repository, by
# a workflow there that holds a token for this one. This is the check on the receiving side: the one
# failure that cannot be undone is a plaintext mappack published by mistake, and anything readable
# under packs/ is exactly that. It matters more now that no person looks at the bytes in between.
#
# It needs nothing but a shell, so it answers within a minute of a publish.
#
# Three triggers, because this one has already been inert once and that must not be possible again.
#
# `page_build` is the fast one: it fires when Pages builds the branch, and -- unlike a `push` event
# -- it is read from the default branch, where this file is. What it replaced was
# `push: branches: [gh-pages]`, which never ran a single time in its whole existence, because a push
# event takes its workflows from the ref that was pushed and gh-pages carries the built site and no
# .github/ at all. Note that a push made with GITHUB_TOKEN starts no workflow, so a deploy of the
# app does not reach this; a publication from the maps repository is made with an App token and
# does.
#
# The schedule is the one that cannot be argued with. A check on what is published is worth nothing
# if it depends on a trigger being right, and the whole point of the file is that nobody is looking
# at these bytes by hand any more.
#
# The job checks gh-pages out explicitly under all three, which is what makes them interchangeable.

on:
  page_build:
  schedule:
    # Every morning. A region that went up wrong is then wrong for hours at most, not until somebody
    # happens to look.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Everything under packs/ is a sealed region
        run: |
          shopt -s nullglob
          bad=0
          found=0
          for f in packs/*; do
            found=$((found + 1))
            if [[ ${f} != *.chlpack ]]; then
              echo "::error file=${f}::not a .chlpack"
              bad=1
              continue
            fi
            size=$(stat -c%s "${f}")
            if [[ ${size} -le 18 ]]; then
              echo "::error file=${f}::shorter than the container header"
              bad=1
            fi
            if [[ "$(head -c 4 "${f}")" != "CHLP" ]]; then
              echo "::error file=${f}::no CHLP magic -- is this plaintext?"
              bad=1
            fi
            version=$(head -c 5 "${f}" | tail -c 1 | od -An -tu1 | tr -d ' ')
            if [[ ${version} != "1" ]]; then
              echo "::error file=${f}::container version ${version}, expected 1"
              bad=1
            fi
          done
          echo "checked ${found} file(s) under packs/"
          exit "${bad}"
