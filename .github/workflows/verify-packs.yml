name: Verify the published regions

# The encrypted regions are published onto gh-pages from the private Chlaedderi/maps repository, by
# a workflow there that holds a token for this one. This is the check on the receiving side: the one
# failure that cannot be undone is a plaintext mappack published by mistake, and anything readable
# under packs/ is exactly that. It matters more now that no person looks at the bytes in between.
#
# It needs nothing but a shell, so it answers within a minute of a publish.
#
# `page_build`, not `push: branches: [gh-pages]`. That is what this said for as long as it existed
# and it never ran once, because a `push` event takes its workflows from the ref that was pushed --
# and gh-pages carries the built site and no .github/ at all. `page_build` fires when Pages builds
# that branch, which is every publish and every deploy, and it is read from the default branch,
# where this file actually is. The job still checks gh-pages out explicitly, as it always did.

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Everything under packs/ is a sealed region
        run: |
          shopt -s nullglob
          bad=0
          found=0
          for f in packs/*; do
            found=$((found + 1))
            if [[ ${f} != *.chlpack ]]; then
              echo "::error file=${f}::not a .chlpack"
              bad=1
              continue
            fi
            size=$(stat -c%s "${f}")
            if [[ ${size} -le 18 ]]; then
              echo "::error file=${f}::shorter than the container header"
              bad=1
            fi
            if [[ "$(head -c 4 "${f}")" != "CHLP" ]]; then
              echo "::error file=${f}::no CHLP magic -- is this plaintext?"
              bad=1
            fi
            version=$(head -c 5 "${f}" | tail -c 1 | od -An -tu1 | tr -d ' ')
            if [[ ${version} != "1" ]]; then
              echo "::error file=${f}::container version ${version}, expected 1"
              bad=1
            fi
          done
          echo "checked ${found} file(s) under packs/"
          exit "${bad}"
