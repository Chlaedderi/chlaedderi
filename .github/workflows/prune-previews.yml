name: Prune stale previews

# The belt to preview.yml's braces. The preview of a pull request is dropped when it closes, but
# not if that run never happened -- a pull request closed while Actions was red, a race with a
# force-push. This sweeps up whatever is left: every pr-N/ whose pull request is no longer open.

on:
  schedule:
    # Mondays, early.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Its own group, like every other workflow that writes the branch: a shared one cancels whichever
# run is waiting rather than queueing it. See tools/publish-pages.sh.
concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop the previews of pull requests that are not open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t open < <(gh pr list --state open --limit 200 --json number --jq '.[].number')
          echo "open pull requests: ${open[*]:-none}"
          ./tools/publish-pages.sh prune "${open[@]}"
